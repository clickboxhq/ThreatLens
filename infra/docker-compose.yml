name: socverse

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: socverse
      POSTGRES_PASSWORD: socverse_dev_password
      POSTGRES_DB: socverse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: socverse
      MINIO_ROOT_PASSWORD: socverse_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # §15.9: the running app connects as the least-privilege `socverse_app` role, not the
      # `socverse` superuser — see prisma/migrations/20260806001500_add_least_privilege_app_role.
      DATABASE_URL: postgresql://socverse_app:socverse_app_dev_password@postgres:5432/socverse
      MIGRATE_DATABASE_URL: postgresql://socverse:socverse_dev_password@postgres:5432/socverse
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_ENDPOINT: minio
      OBJECT_STORAGE_PORT: "9000"
      OBJECT_STORAGE_ACCESS_KEY: socverse
      OBJECT_STORAGE_SECRET_KEY: socverse_dev_password
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ../apps/api:/app
      - api-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ../apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  api-node-modules:
  web-node-modules:
