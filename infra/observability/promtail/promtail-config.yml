server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Auto-discovers every container on the host via the Docker socket (§5.16: "via Docker's
  # logging driver") — no per-service config needed as new containers are added.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Compose names containers "<project>-<service>-<n>" — strip that down to just the
      # service name so Loki queries can filter by e.g. {container="app"} instead of the full
      # "socverse-prod-app-1".
      - source_labels: [__meta_docker_container_name]
        regex: "/(?:[^-]+-)?([a-zA-Z0-9_]+)-\\d+"
        target_label: container
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
