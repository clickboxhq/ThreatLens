# Scrapes the golden signals (§3.10) exposed by apps/api/src/common/metrics and by
# node-exporter (host-level CPU/mem/disk, needed for the disk-usage alert below, which the
# Node process itself has no way to report).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: socverse-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
