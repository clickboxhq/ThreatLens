name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running run for the same branch/PR when a new commit lands,
# so the queue doesn't back up with stale runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — build & test
    runs-on: ubuntu-latest
    # `prisma generate` resolves these at schema-parse time even though it never opens a
    # connection (no live Postgres runs in this job) — without them it fails outright, since
    # the checkout has no `.env` (gitignored, per apps/api/.env.example). Placeholder values
    # only; nothing here ever connects to a real database.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      MIGRATE_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No live database is needed here: `generate` only reads schema.prisma to produce
      # the typed client apps/api's TypeScript imports — every Jest spec in this repo
      # mocks PrismaService directly rather than hitting a real Postgres instance.
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # Type-aware (parserOptions.project in .eslintrc.js), so it needs the generated Prisma
      # client to resolve — must run after `generate`, same as build/test below.
      - run: npm run lint --workspace=apps/api

      - run: npm run build --workspace=apps/api

      - run: npm test --workspace=apps/api -- --ci --coverage

      # coverage-summary.json comes from the json-summary reporter (apps/api/package.json's
      # jest config) — turn its "total" row into a table in the run's summary page so coverage
      # is visible without downloading the artifact below.
      - name: Coverage summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const path = 'apps/api/coverage/coverage-summary.json';
            if (!fs.existsSync(path)) { console.log('No coverage-summary.json found — tests likely failed before coverage was written.'); process.exit(0); }
            const { total } = JSON.parse(fs.readFileSync(path, 'utf8'));
            const pct = (m) => total[m].pct.toFixed(2) + '%';
            const rows = [
              '| Metric | Coverage | Covered / Total |',
              '| --- | --- | --- |',
              \`| Statements | \${pct('statements')} | \${total.statements.covered}/\${total.statements.total} |\`,
              \`| Branches | \${pct('branches')} | \${total.branches.covered}/\${total.branches.total} |\`,
              \`| Functions | \${pct('functions')} | \${total.functions.covered}/\${total.functions.total} |\`,
              \`| Lines | \${pct('lines')} | \${total.lines.covered}/\${total.lines.total} |\`,
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## API coverage\n\n' + rows.join('\n') + '\n');
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-report
          path: apps/api/coverage/
          retention-days: 14

  web:
    name: Web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint --workspace=apps/web

      - run: npm run build --workspace=apps/web

  e2e:
    name: API — e2e (real Postgres + Redis)
    runs-on: ubuntu-latest
    # Unlike the `api` job above, this one runs against real service containers end to end:
    # migrations actually apply, the full AppModule DI graph boots for real, and the
    # Telemetry Generator → Alert Engine → Scoring Engine BullMQ job chain actually runs —
    # exactly what mocked unit tests structurally cannot cover.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: socverse
          POSTGRES_PASSWORD: socverse_dev_password
          POSTGRES_DB: socverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `socverse` is a real superuser role in this container (POSTGRES_USER above), needed
      # for `migrate deploy` to run DDL. `socverse_app` doesn't exist yet at this point — it's
      # self-created by the 20260806001500_add_least_privilege_app_role migration's DO block
      # the moment `migrate deploy` applies it, mirroring exactly how local dev bootstraps it
      # (infra/docker-compose.yml uses the same two-role split, same passwords).
      DATABASE_URL: postgresql://socverse_app:socverse_app_dev_password@localhost:5432/socverse
      MIGRATE_DATABASE_URL: postgresql://socverse:socverse_dev_password@localhost:5432/socverse
      REDIS_URL: redis://localhost:6379
      # No default in code (unlike JWT_ACCESS_TTL_SECONDS/JWT_REFRESH_TTL_DAYS, which fall
      # back to 900/30) — JwtSharedModule fails every sign() call outright without this.
      JWT_ACCESS_SECRET: ci-e2e-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      # The e2e suite looks up published scenarios by slug — without the seed, the catalog
      # is empty and every test past signup/login fails immediately.
      - run: npm run prisma:seed --workspace=apps/api

      - run: npm run test:e2e --workspace=apps/api

  # Only on an actual merge to main, never on a PR build — publishing an image is a real,
  # externally-visible side effect (see also railway-deploy below), not something a PR should
  # trigger just by existing.
  docker-publish:
    name: Publish images to Docker Hub
    runs-on: ubuntu-latest
    needs: [api, web, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `worker` (Railway service, see infra/RAILWAY.md) reuses this exact image with a
      # different start command — same as infra/docker-compose.prod.yml's `app`/`worker`
      # services do locally — so there's no separate worker image to build or push.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile.prod
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/socverse-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/socverse-api:${{ github.sha }}

      # VITE_-prefixed vars are baked into the static bundle at build time (apps/web/Dockerfile.prod's
      # own comment on this) — vars.VITE_API_BASE_URL is a repo variable, not a secret, set once
      # you know the api service's Railway domain (infra/RAILWAY.md).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile.prod
          target: production
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/socverse-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/socverse-web:${{ github.sha }}

  # Railway services are configured to track the `:latest` tag (infra/RAILWAY.md) — this just
  # tells Railway to pull it and restart, the same role `git pull && docker compose up -d`
  # played in the VPS runbook.
  railway-deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - run: npm install -g @railway/cli

      - run: railway redeploy --service api --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Migrations run as part of api's own start command (infra/RAILWAY.md step 2) — worker
      # has no such step and just starts consuming jobs the moment its container is up, so if
      # both redeploy at once, worker could start against a schema api hasn't finished
      # migrating yet. The Railway CLI has no documented flag to wait for a redeploy to become
      # healthy (checked docs.railway.com/cli/redeploy), and api's own /health is a trivial
      # static route that doesn't reflect migration status even if it did — so this is a fixed
      # delay, not a real readiness check. Given every migration so far is purely additive
      # (new tables/columns, nothing renamed or dropped) the actual blast radius of a race here
      # is low, but the ordering gap is real; revisit with a proper migration-aware health
      # check if that assumption ever stops holding.
      - name: Wait for api's migration + boot before starting worker
        run: sleep 60

      - run: railway redeploy --service worker --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - run: railway redeploy --service web --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
