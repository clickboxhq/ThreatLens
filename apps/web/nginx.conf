server {
    # ${PORT} is rendered by the official nginx image's built-in envsubst-on-templates
    # entrypoint (see Dockerfile.prod — this file is copied to /etc/nginx/templates/, not
    # straight to conf.d/) since Railway assigns each service its own port at runtime and
    # ignores the Dockerfile's EXPOSE entirely; a hardcoded `listen 80` gets "Application
    # failed to respond" the moment Railway's actual port differs from 80.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Hashed build filenames (Vite default) are safe to cache indefinitely; index.html itself
    # must always revalidate so a new deploy is picked up on next load, not served stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
