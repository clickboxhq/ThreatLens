server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Hashed build filenames (Vite default) are safe to cache indefinitely; index.html itself
    # must always revalidate so a new deploy is picked up on next load, not served stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
